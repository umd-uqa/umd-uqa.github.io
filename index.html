<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMD UQA - Undergraduate Quantum Association</title>

    <!-- React 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS v2 Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Favicon Configuration -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="manifest" href="./favicon_io/site.webmanifest">
    
    <style>
        @font-face {
            font-family: 'Nexa Free';
            src: url('./nexa_editted/Nexa-ExtraLight.woff2') format('woff2'),
                 url('./nexa_editted/Nexa-ExtraLight.woff') format('woff');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Nexa Free';
            src: url('./nexa_editted/Nexa-Heavy.woff2') format('woff2'),
                 url('./nexa_editted/Nexa-Heavy.woff') format('woff');
            font-weight: 800;
            font-style: normal;
            font-display: swap;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }
        body {
            background-color: #0f1128;
            margin: 0;
            min-height: 100vh;
        }

        #root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    </style>
</head>
<body>
<div id="root"></div>

<!-- Supabase Config & Client Layer -->
<script type="text/babel" src="./supabase-config.js"></script>

<!-- Google Auth Config & Service -->
<script type="text/babel" src="./google-auth-config.js"></script>
<script type="text/babel" src="./auth.js"></script>

<!-- Application Components -->
<script type="text/babel" src="./Navbar.js"></script>
<script type="text/babel" src="./Home.js"></script>
<script type="text/babel" src="./About.js"></script>
<script type="text/babel" src="./Schedule.js"></script>
<script type="text/babel" src="./Contact.js"></script>
<script type="text/babel" src="./Resources.js"></script>
<script type="text/babel" src="./AuthPortal.js"></script>
<script type="text/babel" src="./Admin.js"></script>

<!-- Main App Router -->
<script type="text/babel" src="./App.js"></script>
</body>
</html>
