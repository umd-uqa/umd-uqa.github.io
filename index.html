<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMD UQA - Undergraduate Quantum Association</title>

    <!-- React 18 & Babel Standalone -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Identity Services (GIS) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        body {
            background-color: #0f1128;
            margin: 0;
            min-height: 100vh;
        }

        #root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
    </style>
</head>
<link rel="icon" type="image/png" href="UQA_Favicon.png">
<body>
<div id="root"></div>

<!-- Google Auth Config & Service -->
<script type="text/babel" src="./google-auth-config.js"></script>
<script type="text/babel" src="./auth.js"></script>

<!-- Application Components -->
<script type="text/babel" src="./Navbar.js"></script>
<script type="text/babel" src="./Home.js"></script>
<script type="text/babel" src="./About.js"></script>
<script type="text/babel" src="./Events.js"></script>
<script type="text/babel" src="./Contact.js"></script>
<script type="text/babel" src="./Calendar.js"></script>
<script type="text/babel" src="./Resources.js"></script>
<script type="text/babel" src="./AuthPortal.js"></script>

<!-- Main App Router -->
<script type="text/babel" src="./App.js"></script>
</body>
</html>
